<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah Mae Online Assistance</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
            line-height: 1.5;
        }

        header {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: white;
            text-align: center;
            padding: 30px 16px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: clamp(23px, 5vw, 32px);
        }

        header p {
            margin: 0;
            font-size: 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 24px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 22px;
            color: #1d4ed8;
            font-size: 23px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            max-width: 100%;
            padding: 13px 14px;
            margin: 0 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #fff;
            color: #0f172a;
            font: inherit;
            font-size: 16px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #formMessage {
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            header {
                padding: 24px 14px;
            }

            .container {
                margin: 16px auto;
                padding: 0 12px;
            }

            .card {
                padding: 19px 16px;
                border-radius: 12px;
            }

            .card h2 {
                font-size: 21px;
            }
        }
    
.leah-photo-wrap {
    text-align: center;
    margin: 10px auto 24px;
}
.leah-photo {
    display: block;
    width: 150px;
    height: 150px;
    max-width: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #ffffff;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
    margin: 0 auto;
}
.leah-photo-caption {
    margin: 10px 0 0;
    font-weight: 600;
    color: #234b80;
}

</style>

    <meta name="theme-color" content="#1d4ed8">
    <link rel="manifest" href="/manifest.webmanifest">

</head>

<body>

<header>
    <h1>Leah Mae Online Assistance</h1>
    <p>Appointment and Online Assistance</p>
</header>

<div class="container">
    <div class="card">

        <div class="leah-photo-wrap">
            <img
                src="/leah-mae-photo.jpg"
                alt="Leah Mae Navarro"
                class="leah-photo"
            >
            <p class="leah-photo-caption">Leah Mae Navarro</p>
        </div>

        <h2>Book an Appointment</h2>

       <form id="appointmentForm">

    <label>Full Name</label>
    <input
        type="text"
        name="fullName"
        placeholder="Enter your name"
        required
    >

    <label>Service</label>
    <select name="service" required>
        <option value="">Select a service</option>
        <option value="Marina Appointment">Marina Appointment - ₱500</option>
        <option value="DFA Appointment">DFA Appointment - ₱350</option>
        <option value="PSA Appointment">PSA Appointment - ₱150</option>
        <option value="NBI Appointment">NBI Appointment - ₱350</option>
        <option value="Police Clearance">Police Clearance - ₱350</option>
        <option value="SSS/Pag-IBIG/PhilHealth Registration">
            SSS/Pag-IBIG/PhilHealth Registration - ₱300
        </option>
    </select>

    <label>
        Method of Payment <span class="required">*</span>
    </label>
    <select name="paymentMethod" required>
        <option value="">-- Select Payment Method --</option>
        <option value="GCash">GCash</option>
        <option value="Maya">Maya</option>
        <option value="Bank Transfer">Bank Transfer</option>
        <option value="Cash">Cash</option>
        <option value="Other">Other</option>
    </select>
    <p>Payment timing: <strong>After Approval</strong></p>
    <p>Payment instructions will be provided after your application is approved.</p>

    <label>Contact Number</label>
    <input
        type="tel"
        name="contact"
        placeholder="Enter your contact number"
        required
    >

    <label>Email Address</label>
    <input
        type="email"
        name="email"
        placeholder="example@gmail.com"
    >

    <label>Complete Address</label>
    <textarea
        name="address"
        placeholder="Enter your complete address"
        rows="3"
    ></textarea>

    <label>Preferred Date</label>
    <input
        type="date"
        name="preferredDate"
    >

    <label>Preferred Time</label>
    <input
        type="time"
        name="preferredTime"
    >

    <label>Additional Message</label>
    <textarea
        name="message"
        placeholder="Additional information or request..."
        rows="3"
    ></textarea>

    <button type="submit">Submit Appointment</button>

</form>
<p id="formMessage" role="status" aria-live="polite"></p>

    </div>
</div>


<script>
const appointmentForm = document.getElementById("appointmentForm");
const formMessage = document.getElementById("formMessage");
let submittingAppointment = false;
let pendingAppointmentKey = null;

appointmentForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (submittingAppointment) return;

    submittingAppointment = true;
    if (!pendingAppointmentKey) pendingAppointmentKey = crypto.randomUUID();
    const requestKey = pendingAppointmentKey;

    const button = appointmentForm.querySelector('button[type="submit"]');
    const originalText = button.textContent;

    button.disabled = true;
    button.textContent = "Submitting...";
    formMessage.textContent = "Submitting application...";

    try {
        const response = await fetch("/api/appointments", {
            method: "POST",
            body: (() => {
                const data = new FormData(appointmentForm);
                data.set("requestKey", requestKey);
                return new URLSearchParams(data);
            })()
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Submission failed.");
        }

        formMessage.textContent =
            result.message + " Reference number: " + result.id;
        formMessage.style.color = "green";
        appointmentForm.reset();
        pendingAppointmentKey = null;

    } catch (error) {
        formMessage.textContent =
            "Unable to confirm submission: " + error.message +
            ". Check your bookings before trying again.";
        formMessage.style.color = "red";

    } finally {
        submittingAppointment = false;
        button.disabled = false;
        button.textContent = originalText;
    }
});
</script>


<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .catch((error) => console.error("Service worker registration failed:", error));
  });
}
</script>

</body>
</html>
